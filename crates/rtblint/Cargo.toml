[package]
name = "rtblint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OpenRTB bid request / response linter — validates OpenRTB 2.x and 3.0 objects"
keywords = ["openrtb", "rtb", "adtech", "programmatic", "validator"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[[bin]]
name = "rtblint"
path = "src/main.rs"

[dependencies]
rtblint-core = { path = "../rtblint-core", version = "0.0.1" }
