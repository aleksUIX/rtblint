[package]
name = "rtblint-resolve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Opt-in sellers.json / ads.txt resolution for RTBlint, against a locally cached reference database"
keywords = ["openrtb", "rtb", "adtech", "sellers-json", "ads-txt"]
categories = ["development-tools"]
readme = "../../README.md"

[dependencies]
rtblint-core = { path = "../rtblint-core", version = "0.11.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
