[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtblint"
version = "0.0.1"
description = "OpenRTB bid request / response linter — validates OpenRTB 2.x and 3.0 objects"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Aleks", email = "aleks@vastlint.org" }]
keywords = ["openrtb", "rtb", "adtech", "programmatic", "validator"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/aleksUIX/rtblint"
Repository = "https://github.com/aleksUIX/rtblint"

[tool.hatch.build.targets.wheel]
packages = ["src/rtblint"]
