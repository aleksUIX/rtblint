# Legacy Smithery stdio image. The listing that agents actually use is the
# hosted Streamable HTTP endpoint at https://rtblint.org/mcp, published with:
#   npx @smithery/cli mcp publish "https://rtblint.org/mcp" -n aleksander/rtblint
# Keep this file for the local-bundle path; do not point Smithery at the
# Dockerfile as the primary listing.
# rtblint-mcp takes no configuration: no API keys, env, or args.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    required: []
  commandFunction: |
    (config) => ({ command: "/usr/local/bin/rtblint-mcp", args: [] })
  exampleConfig: {}
