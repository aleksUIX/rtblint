# Simulated ARTF stack. Four containers on one Docker network.
#
#   publisher (you, the browser) -> SSP -> agent (mutations)
#                                    |-> rtblint (real gRPC)
#                                    |-> DSP (only if the request-side check passes)
#
# The console TV is a dummy CTV stage so a trader can see the slot. It is not
# a player. Delivery / VAST is the hop after a win. ARTF stops at the auction.

name: artf-sim

services:
  rtblint:
    build:
      context: ../..
      dockerfile: Dockerfile.grpc
    ports:
      - "50061:50061"
      - "9091:9091"
    environment:
      RTBLINT_GRPC_ADDR: "0.0.0.0:50061"
      RTBLINT_METRICS_ADDR: "0.0.0.0:9091"
      RTBLINT_LIMIT_INITIAL: "256"
      RTBLINT_LIMIT_MIN: "64"
      RTBLINT_LIMIT_MAX: "2048"
      RTBLINT_LIMIT_TARGET_LATENCY_MS: "20"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/50061'"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s

  agent:
    build:
      context: ../..
      dockerfile: demo/artf/stack/agent/Dockerfile
    environment:
      PORT: "8091"
      FIXTURES: /fixtures
    ports:
      - "8091:8091"
    volumes:
      - ./stack/agent/server.mjs:/app/server.mjs
      - ./fixtures/policy-mutations.json:/fixtures/policy-mutations.json

  dsp:
    build:
      context: ../..
      dockerfile: demo/artf/stack/dsp/Dockerfile
    environment:
      PORT: "8092"
    ports:
      - "8092:8092"

  ssp:
    build:
      context: ../..
      dockerfile: demo/artf/stack/ssp/Dockerfile
    environment:
      PORT: "8080"
      RTBLINT_ADDR: "rtblint:50061"
      AGENT_URL: "http://agent:8091"
      DSP_URL: "http://dsp:8092"
      GRAFANA_URL: "http://localhost:3001/d/artf-sim"
      FIXTURES: /fixtures
      PROTO: /proto/openadtech/rtblint/v1/rtblint.proto
      PROTO_ROOT: /proto
    ports:
      - "8080:8080"
    volumes:
      - ./stack/ssp/public:/app/public
      - ./stack/ssp/server.mjs:/app/server.mjs
      - ./stack/ssp/ticket.mjs:/app/ticket.mjs
      - ./fixtures/policy-mutations.json:/fixtures/policy-mutations.json
    depends_on:
      rtblint:
        condition: service_healthy
      agent:
        condition: service_started
      dsp:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    volumes:
      - ./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9092:9090"
    depends_on:
      - rtblint
      - ssp

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/artf-sim.json
    volumes:
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
