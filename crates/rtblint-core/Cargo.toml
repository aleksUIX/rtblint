[package]
name = "rtblint-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OpenRTB linter: validates OpenRTB 2.x bid requests and bid responses against versioned IAB spec snapshots"
keywords = ["openrtb", "rtb", "adtech", "programmatic", "validator"]
categories = ["parser-implementations", "development-tools"]
readme = "../../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde_json = "1"
