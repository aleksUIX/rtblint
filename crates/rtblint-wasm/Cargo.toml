[package]
name = "rtblint-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WASM bindings for rtblint-core: validate OpenRTB payloads in the browser, Node, and edge workers"
keywords = ["openrtb", "rtb", "validator", "adtech", "wasm"]
categories = ["parser-implementations", "wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
rtblint-core = { path = "../rtblint-core", version = "0.3.0" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
