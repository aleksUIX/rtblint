[package]
name = "rtblint-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server for rtblint: exposes OpenRTB bid request and bid response validation as callable tools"
keywords = ["openrtb", "rtb", "adtech", "mcp", "validator"]
categories = ["development-tools", "web-programming"]
readme = "../../README.md"

[[bin]]
name = "rtblint-mcp"
path = "src/main.rs"

[dependencies]
rtblint-core = { path = "../rtblint-core", version = "0.1.0" }
serde_json = "1"
