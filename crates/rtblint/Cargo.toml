[package]
name = "rtblint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "OpenRTB linter: validates OpenRTB 2.x bid requests and bid responses against versioned IAB spec snapshots"
keywords = ["openrtb", "rtb", "adtech", "programmatic", "validator"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[[bin]]
name = "rtblint"
path = "src/main.rs"

[dependencies]
rtblint-core = { path = "../rtblint-core", version = "0.10.0" }
rtblint-resolve = { path = "../rtblint-resolve", version = "0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
