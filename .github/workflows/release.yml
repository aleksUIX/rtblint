name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach CLI binaries to (for example v0.11.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # pinned SHA
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Smoke-test committed npm package
        run: |
          workspace_version=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          node <<EOF
          const r = require("./npm/index.cjs");
          const pkg = require("./npm/package.json");
          const out = r.validate(JSON.stringify({ id: "ci", imp: [{ id: "i", banner: {} }] }));
          if (!out.valid) {
            throw new Error("committed wasm artifact failed smoke test: " + JSON.stringify(out));
          }
          if (r.coreVersion() !== "$workspace_version" || pkg.version !== "$workspace_version") {
            throw new Error("version drift: workspace $workspace_version, wasm " + r.coreVersion() + ", package.json " + pkg.version + ". Rebuild npm/wasm.");
          }
          console.log("npm wasm ok, core", r.coreVersion());
          EOF

  publish-crates:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # pinned SHA
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Publish crates
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret not set; skipping crates.io publish."
            exit 0
          fi
          for crate in rtblint-core rtblint-resolve rtblint rtblint-mcp; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name==\"$crate\") | .version")
            if curl -sf "https://crates.io/api/v1/crates/$crate/$version" -H "User-Agent: rtblint-release" > /dev/null; then
              echo "$crate $version already on crates.io; skipping."
            else
              cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish npm package
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set; skipping npm publish."
            exit 0
          fi
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version already on npm; skipping."
          else
            npm publish --access public
          fi
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publishes the hosted MCP (https://rtblint.org/mcp) to smithery.ai.
  # Same account as vastlint (aleksander/vastlint). One-time:
  #   1. Smithery account → API Keys
  #   2. Repo secret SMITHERY_API_KEY
  #   3. Repo variable ENABLE_SMITHERY_PUBLISH = true
  publish-smithery:
    name: Publish to Smithery
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && vars.ENABLE_SMITHERY_PUBLISH == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
      - name: Publish to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          out=$(npx --yes @smithery/cli@latest mcp publish \
            "https://rtblint.org/mcp" \
            -n "aleksander/rtblint" 2>&1) && echo "$out" && exit 0
          echo "$out"
          echo "$out" | grep -qiE "namespace not found|already exists|duplicate" && exit 0
          exit 1

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: rtblint-linux-x86_64.tar.gz

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: rtblint-linux-aarch64.tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            archive: rtblint-macos-x86_64.tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            archive: rtblint-macos-aarch64.tar.gz

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # pinned SHA
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools

      # aarch64-unknown-linux-musl needs a cross linker. See vastlint's
      # release.yml: `cross` silently falls back to host cargo here.
      - name: Set up cross toolchain (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8  # v1.42.0
        with:
          target: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p rtblint

      - name: Package
        run: |
          BINARY=target/${{ matrix.target }}/release/rtblint
          tar czf ${{ matrix.archive }} -C "$(dirname "$BINARY")" "$(basename "$BINARY")"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release-binaries:
    name: Attach CLI binaries
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --notes "See CHANGELOG.md for details."
          fi
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
