[workspace]
members = [
    "crates/rtblint-core",
    "crates/rtblint",
    "crates/rtblint-mcp",
    "crates/rtblint-wasm",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.74"
authors = ["Aleks <aleks@vastlint.org>"]
license = "Apache-2.0"
repository = "https://github.com/aleksUIX/rtblint"
homepage = "https://rtblint.org"
