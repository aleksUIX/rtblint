# Recording ports are local and separate from the multi-agent lab.
services:
  rtblint:
    ports: !override ["127.0.0.1:50061:50061", "127.0.0.1:9091:9091"]
  agent:
    ports: !override ["127.0.0.1:8091:8091"]
  dsp:
    ports: !override ["127.0.0.1:8092:8092"]
  ssp:
    environment:
      PACE_MS: "350"
    ports: !override ["127.0.0.1:8080:8080"]
  prometheus:
    ports: !override ["127.0.0.1:9092:9090"]
  grafana:
    ports: !override ["127.0.0.1:3001:3000"]
