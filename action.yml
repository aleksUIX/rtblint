name: rtblint OpenRTB Validator
description: Validate OpenRTB JSON in CI using the rtblint CLI
branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: File or NDJSON stream passed to `rtblint validate`
    required: true
  version:
    description: >
      rtblint release tag (for example v0.11.0), latest, or auto. auto uses the
      action's own v* tag when pinned, otherwise latest.
    required: false
    default: auto
  spec-version:
    description: OpenRTB spec snapshot passed as `--version` (for example 2.6-202505)
    required: false
    default: ""
  type:
    description: Payload type (request, response, artf-request, artf-response)
    required: false
    default: request
  dialect:
    description: JSON dialect (spec-json or proto-json)
    required: false
    default: ""
  profile:
    description: Exchange profile (spec, google-ab, prebid-server, xandr, magnite)
    required: false
    default: ""
  format:
    description: Output format (human or json)
    required: false
    default: ""
  request:
    description: Originating bid request or ARTF envelope for response pairing
    required: false
    default: ""
  batch:
    description: Treat path as NDJSON (one payload per line)
    required: false
    default: "false"
  summary:
    description: Print rule-frequency totals for an NDJSON stream
    required: false
    default: "false"
  extra-args:
    description: Additional args appended to `rtblint validate` (space-separated)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install rtblint
      shell: bash
      run: |
        set -euo pipefail

        case "$(uname -s)" in
          Linux)  os="linux" ;;
          Darwin) os="macos" ;;
          *)
            echo "Unsupported runner OS: $(uname -s)"
            exit 1
            ;;
        esac

        case "$(uname -m)" in
          x86_64|amd64) arch="x86_64" ;;
          arm64|aarch64) arch="aarch64" ;;
          *)
            echo "Unsupported runner architecture: $(uname -m)"
            exit 1
            ;;
        esac

        requested="${{ inputs.version }}"
        action_ref="${{ github.action_ref }}"
        if [[ -n "$requested" && "$requested" != "auto" ]]; then
          version="$requested"
        elif [[ "$action_ref" == v* ]]; then
          version="$action_ref"
        else
          version="latest"
        fi

        artifact="rtblint-${os}-${arch}.tar.gz"
        if [[ "$version" == "latest" ]]; then
          url="https://github.com/aleksUIX/rtblint/releases/latest/download/${artifact}"
        else
          url="https://github.com/aleksUIX/rtblint/releases/download/${version}/${artifact}"
        fi

        mkdir -p "$RUNNER_TEMP/rtblint-bin"
        curl -fsSL "$url" -o "$RUNNER_TEMP/rtblint.tar.gz"
        tar -xzf "$RUNNER_TEMP/rtblint.tar.gz" -C "$RUNNER_TEMP/rtblint-bin"
        chmod +x "$RUNNER_TEMP/rtblint-bin/rtblint"
        echo "$RUNNER_TEMP/rtblint-bin" >> "$GITHUB_PATH"

    - name: Run rtblint validate
      shell: bash
      run: |
        set -euo pipefail

        cmd=(rtblint validate "${{ inputs.path }}")

        if [[ "${{ inputs.type }}" != "request" ]]; then
          cmd+=(--type "${{ inputs.type }}")
        fi

        if [[ -n "${{ inputs.spec-version }}" ]]; then
          cmd+=(--version "${{ inputs.spec-version }}")
        fi

        if [[ -n "${{ inputs.dialect }}" ]]; then
          cmd+=(--dialect "${{ inputs.dialect }}")
        fi

        if [[ -n "${{ inputs.profile }}" ]]; then
          cmd+=(--profile "${{ inputs.profile }}")
        fi

        if [[ -n "${{ inputs.format }}" ]]; then
          cmd+=(--format "${{ inputs.format }}")
        fi

        if [[ -n "${{ inputs.request }}" ]]; then
          cmd+=(--request "${{ inputs.request }}")
        fi

        if [[ "${{ inputs.batch }}" == "true" ]]; then
          cmd+=(--batch)
        fi

        if [[ "${{ inputs.summary }}" == "true" ]]; then
          cmd+=(--summary)
        fi

        if [[ -n "${{ inputs.extra-args }}" ]]; then
          read -r -a extra <<< "${{ inputs.extra-args }}"
          cmd+=("${extra[@]}")
        fi

        "${cmd[@]}"
