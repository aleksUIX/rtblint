global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: rtblint
    static_configs:
      - targets: ["rtblint:9091"]
        labels:
          service: rtblint-grpc
  - job_name: ssp
    metrics_path: /metrics
    static_configs:
      - targets: ["ssp:8080"]
        labels:
          service: artf-ssp
