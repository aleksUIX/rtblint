name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The published schemas are generated from the catalogs; a catalog change
      # that does not regenerate them would ship a stale contract.
      - name: Check generated JSON Schemas are current
        run: |
          cargo run -p rtblint-core --example export_json_schemas
          if ! git diff --quiet -- schemas; then
            echo "schemas/ is out of date. Run: cargo run -p rtblint-core --example export_json_schemas"
            git --no-pager diff --stat -- schemas
            exit 1
          fi

  proto:
    name: Proto contract
    runs-on: ubuntu-latest
    steps:
      # buf breaking compares this commit against the tip of main, so the job
      # needs real history rather than the default shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # buf comes from the npm devDependency, so its version is pinned by the
      # lockfile rather than by whatever the runner happens to have.
      - name: Install buf
        run: npm ci

      - name: buf lint
        run: npx buf lint

      - name: buf format check
        run: npx buf format --diff --exit-code

      # The backward-compatibility gate. Any change to a published field number,
      # field type, enum value, or RPC signature fails here rather than being
      # found by a consumer after release.
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: npx buf breaking --against '.git#branch=main'

  wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build WASM crate
        run: cargo build -p rtblint-wasm --target wasm32-unknown-unknown

      - name: Smoke-test committed npm package
        run: |
          workspace_version=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          node <<EOF
          const r = require("./npm/index.cjs");
          const out = r.validate(JSON.stringify({ id: "ci", imp: [{ id: "i", banner: {} }] }));
          if (!out.valid) {
            throw new Error("committed wasm artifact failed smoke test: " + JSON.stringify(out));
          }
          const pkg = require("./npm/package.json");
          if (r.coreVersion() !== "$workspace_version" || pkg.version !== "$workspace_version") {
            throw new Error("version drift: workspace $workspace_version, wasm " + r.coreVersion() + ", package.json " + pkg.version + ". Rebuild npm/wasm.");
          }
          console.log("npm wasm ok, core", r.coreVersion());
          EOF
